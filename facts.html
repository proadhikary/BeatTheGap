<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Did You Know? - BeatTheGap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .carousel-container {
            perspective: 1000px;
        }

        .card-carousel {
            transition: transform 0.5s ease-in-out;
            transform-style: preserve-3d;
        }

        .fact-card {
            backface-visibility: hidden;
        }
    </style>
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="h-10 w-10 bg-yellow-400 rounded-full flex items-center justify-center text-white font-bold text-lg">
                    DYK
                </div>
                <span class="text-xl font-bold text-yellow-600">Did You Know?</span>
            </a>
        </div>
        <nav>
            <a href="index.html"
                class="text-yellow-600 font-bold hover:text-dark-purple transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-6 flex flex-col items-center justify-center relative overflow-hidden bg-yellow-50">
        <!-- Background decorative blobs -->
        <div
            class="absolute top-10 right-10 w-64 h-64 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-blob">
        </div>
        <div
            class="absolute bottom-10 left-10 w-64 h-64 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-60 animate-blob animation-delay-2000">
        </div>

        <div class="text-center mb-10 z-10">
            <h1 class="text-4xl font-bold text-dark-purple mb-3">Women in AI: Trailblazers</h1>
            <p class="text-gray-600 max-w-xl mx-auto">Swipe to discover inspiring facts and achievements of Indian women
                in STEM and AI.</p>
        </div>

        <div class="relative w-full max-w-lg mx-auto carousel-container z-10">
            <div id="card-stack" class="relative h-96 w-full">
                <!-- Cards will be injected here via JS -->
            </div>

            <!-- Navigation Controls -->
            <div class="flex justify-center gap-6 mt-8">
                <button id="prev-btn"
                    class="h-12 w-12 rounded-full bg-white shadow-md flex items-center justify-center text-yellow-600 hover:bg-yellow-500 hover:text-white transition-all transform hover:scale-110">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button id="next-btn"
                    class="h-12 w-12 rounded-full bg-white shadow-md flex items-center justify-center text-yellow-600 hover:bg-yellow-500 hover:text-white transition-all transform hover:scale-110">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <p class="text-center text-gray-400 text-sm mt-4">Tip: Click buttons or use arrow keys</p>
        </div>
    </main>
    <script src="facts.js"></script>
</body>

</html>
