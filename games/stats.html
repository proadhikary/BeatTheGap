<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Slider - BeatTheGap | Estimate Statistics</title>
    <meta name="description" content="Estimate gender statistics in STEM using interactive sliders. Guess real statistics about women in science. Part of the BeatTheGap arcade.">
    <meta name="keywords" content="statistics, STEM data, gender gap, interactive estimation, awareness">
    <meta name="author" content="STEMtheGap">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Stat Slider - BeatTheGap">
    <meta property="og:description" content="Estimate gender statistics in STEM with interactive sliders">
    <meta property="og:image" content="../og-image.webp">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Stat Slider - BeatTheGap">
    <meta name="twitter:description" content="Interactive game to estimate STEM statistics">
    <meta name="twitter:image" content="../og-image.webp">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../og-image.webp">
    <link rel="alternate icon" type="image/webp" href="../og-image.webp">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #dd4760;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center bg-cyan-50">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div class="rounded-full p-1 bg-yellow-400">
                    <img src="../og-image.webp" alt="BeatTheGap Logo" class="h-10 w-10 rounded-full object-cover">
                </div>
                <span class="text-xl font-bold text-pink-custom">BeatTheGap</span>
            </a>
        </div>
        <nav>
            <a href="../index.html"
                class="text-pink-custom font-bold hover:text-purple-900 transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-6 flex flex-col items-center justify-center bg-cyan-50">
        <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 text-center">

            <div id="game-content">
                <div class="mb-2 text-cyan-500 font-bold tracking-wider text-sm">GUESS THE STAT</div>
                <h1 id="question-text"
                    class="text-2xl font-bold text-dark-purple mb-10 h-20 flex items-center justify-center">
                    <!-- Question injected -->
                </h1>

                <div class="relative mb-12 px-4">
                    <div class="flex justify-between text-xs text-gray-400 font-bold mb-2">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                    <input type="range" id="guess-slider" min="0" max="100" value="50" class="w-full">
                    <div id="guess-bubble"
                        class="absolute -top-10 left-1/2 transform -translate-x-1/2 bg-pink-500 text-white font-bold py-1 px-3 rounded-lg text-sm transition-all">
                        50%
                    </div>
                </div>

                <div id="results-area" class="hidden mb-8 bg-gray-50 p-6 rounded-xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Your Guess:</span>
                            <span id="user-guess-display" class="font-bold text-pink-500 text-xl">50%</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-gray-600 font-medium">Actual Data:</span>
                            <span id="actual-data-display" class="font-bold text-green-500 text-xl">43%</span>
                        </div>
                        <div class="h-4 w-full bg-gray-200 rounded-full relative mt-2 overflow-hidden">
                            <div id="bar-user" class="absolute h-full bg-pink-300 opacity-70" style="width: 50%"></div>
                            <div id="bar-actual" class="absolute h-full bg-green-500 opacity-70" style="width: 43%">
                            </div>
                        </div>
                        <p id="fact-explanation"
                            class="text-sm text-gray-600 mt-2 text-left italic border-l-4 border-cyan-300 pl-3">
                            <!-- Explanation -->
                        </p>
                    </div>
                </div>

                <button id="submit-btn" onclick="submitGuess()"
                    class="bg-purple-600 hover:bg-purple-700 text-white px-10 py-3 rounded-full font-bold shadow-lg w-full transition-colors">
                    Submit Guess
                </button>
                <button id="next-btn" onclick="nextQuestion()"
                    class="hidden bg-cyan-600 text-white hover:bg-cyan-700 px-10 py-3 rounded-full font-bold shadow-lg w-full transition-colors">
                    Next Question
                </button>

            </div>

            <div id="end-screen" class="hidden">
                <div
                    class="h-24 w-24 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6 text-yellow-500">
                    <i class="fa-solid fa-chart-pie text-5xl"></i>
                </div>
                <h2 class="text-3xl font-bold mb-4">Data Wiz!</h2>
                <p class="mb-6 text-gray-600">You've explored the real numbers behind the gender gap.</p>
                <button onclick="restartGame()" class="btn-pink px-8 py-3 rounded-full font-bold">Restart</button>
            </div>
        </div>
    </main>

    <script src="stats.js"></script>
</body>

</html>
