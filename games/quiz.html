<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Gap Quiz - BeatTheGap | Test Your Knowledge</title>
    <meta name="description" content="Test your knowledge about gender representation in STEM and AI through our interactive quiz game. Part of the BeatTheGap arcade.">
    <meta name="keywords" content="gender gap, STEM quiz, interactive game, women in science">
    <meta name="author" content="STEMtheGap">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Gender Gap Quiz - BeatTheGap">
    <meta property="og:description" content="Test your knowledge about gender representation in STEM and AI">
    <meta property="og:image" content="../og-image.webp">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gender Gap Quiz - BeatTheGap">
    <meta name="twitter:description" content="Interactive STEM gender gap quiz game">
    <meta name="twitter:image" content="../og-image.webp">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../og-image.webp">
    <link rel="alternate icon" type="image/webp" href="../og-image.webp">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div class="rounded-full p-1 bg-yellow-400">
                    <img src="../og-image.webp" alt="BeatTheGap Logo" class="h-10 w-10 rounded-full object-cover">
                </div>
                <span class="text-xl font-bold text-pink-custom">BeatTheGap</span>
            </a>
        </div>
        <nav>
            <a href="../index.html"
                class="text-pink-custom font-bold hover:text-purple-900 transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-6 md:p-12 flex items-center justify-center relative overflow-hidden">
        <!-- Background decorative blobs -->
        <div
            class="absolute top-20 left-20 w-72 h-72 bg-pink-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob">
        </div>
        <div
            class="absolute bottom-20 right-20 w-72 h-72 bg-purple-200 rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-blob animation-delay-2000">
        </div>

        <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden relative z-10">
            <!-- Start Screen -->
            <div id="start-screen" class="p-8 text-center">
                <div
                    class="h-24 w-24 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-6 text-pink-500">
                    <i class="fa-solid fa-clipboard-question text-4xl"></i>
                </div>
                <h1 class="text-3xl font-bold mb-4 text-dark-purple">Gender Gap in AI Quiz</h1>
                <p class="text-gray-600 mb-8 text-lg">How much do you really know about the state of women in AI and
                    Indian academia? Test your knowledge with these 5 insightful questions.</p>
                <button id="start-btn"
                    class="btn-pink px-10 py-4 rounded-full font-bold text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                    Start Quiz
                </button>
            </div>

            <!-- Quiz Screen -->
            <div id="quiz-screen" class="hidden p-8">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-sm font-bold text-gray-500">Question <span id="current-question">1</span>/5</span>
                    <span class="text-sm font-bold text-pink-500">Score: <span id="current-score">0</span></span>
                </div>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-2.5 mb-8">
                    <div id="progress-bar" class="bg-pink-500 h-2.5 rounded-full transition-all duration-300"
                        style="width: 0%"></div>
                </div>

                <div class="mb-8">
                    <h2 id="question-text" class="text-xl md:text-2xl font-bold text-dark-purple mb-6 leading-relaxed">
                        Question goes here...</h2>
                    <div id="options-container" class="space-y-3">
                        <!-- Options injected by JS -->
                    </div>
                </div>

                <div id="feedback-container" class="hidden mt-6 p-4 rounded-lg bg-gray-50 border-l-4">
                    <p id="feedback-text" class="text-gray-800"></p>
                    <button id="next-btn"
                        class="mt-4 bg-purple-900 text-white px-6 py-2 rounded-lg hover:bg-purple-800 transition-colors">Next
                        Question</button>
                </div>
            </div>

            <!-- Result Screen -->
            <div id="result-screen" class="hidden p-8 text-center">
                <div class="mb-6">
                    <i id="result-icon" class="fa-solid fa-trophy text-6xl text-yellow-400 mb-4 animate-bounce"></i>
                    <h2 class="text-3xl font-bold text-dark-purple mb-2">Quiz Completed!</h2>
                    <p class="text-gray-600">You scored <span id="final-score"
                            class="font-bold text-pink-500 text-xl">0</span> out of 5</p>
                </div>

                <div id="result-message" class="bg-pink-50 p-6 rounded-xl mb-8 text-dark-purple font-medium">
                    <!-- Message based on score -->
                </div>

                <div class="flex flex-col md:flex-row gap-4 justify-center">
                    <button id="restart-btn"
                        class="border-2 border-pink-500 text-pink-500 hover:bg-pink-50 px-8 py-3 rounded-full font-bold transition-colors">
                        Try Again
                    </button>
                    <a href="../index.html" class="btn-pink px-8 py-3 rounded-full font-bold transition-colors">
                        Explore More Apps
                    </a>
                </div>
            </div>
        </div>
    </main>
    <script src="quiz.js"></script>
</body>

</html>
