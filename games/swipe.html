<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fact or Fiction? - BeatTheGap | Swipe to Decide</title>
    <meta name="description"
        content="Swipe to identify facts and fiction about STEM and gender representation. Test your knowledge in this interactive swipe game. Part of the BeatTheGap arcade.">
    <meta name="keywords" content="fact checking, STEM facts, interactive game, critical thinking, women in science">
    <meta name="author" content="STEMtheGap">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="Fact or Fiction? - BeatTheGap">
    <meta property="og:description" content="Swipe to identify facts and fiction about STEM and gender">
    <meta property="og:image" content="../og-image.webp">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fact or Fiction? - BeatTheGap">
    <meta name="twitter:description" content="Interactive swipe game about STEM facts">
    <meta name="twitter:image" content="../og-image.webp">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../og-image.webp">
    <link rel="alternate icon" type="image/webp" href="../og-image.webp">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .tinder-card {
            position: absolute;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            transform-origin: 50% 100%;
        }

        .stamp {
            display: none;
            position: absolute;
            top: 2rem;
            border: 4px solid;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            transform: rotate(-15deg);
            z-index: 10;
        }

        .stamp-fact {
            border-color: #22c55e;
            color: #22c55e;
            right: 2rem;
        }

        .stamp-fiction {
            border-color: #ef4444;
            color: #ef4444;
            left: 2rem;
        }
    </style>
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center bg-purple-50">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div class="rounded-full p-1 bg-yellow-400">
                    <img src="../og-image.webp" alt="BeatTheGap Logo" class="h-10 w-10 rounded-full object-cover">
                </div>
                <span class="text-xl font-bold text-pink-custom">BeatTheGap</span>
            </a>
        </div>
        <nav>
            <a href="../index.html"
                class="text-pink-custom font-bold hover:text-purple-900 transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-4 flex flex-col items-center justify-center relative overflow-hidden bg-indigo-50">
        <div class="text-center mb-8 px-4">
            <h1 class="text-3xl font-bold text-dark-purple mb-2">Fact or Fiction?</h1>
            <p class="text-gray-600 max-w-md mx-auto">Swipe Right (Check) for FACT.<br>Swipe Left (Cross) for FICTION.
            </p>
            <div class="mt-4 font-bold text-lg">
                Score: <span id="score" class="text-indigo-600">0</span>
            </div>
        </div>

        <div id="card-container" class="relative w-full max-w-sm h-96">
            <!-- Cards injected by JS -->
            <div id="end-card"
                class="hidden absolute inset-0 bg-white rounded-2xl shadow-xl p-8 flex flex-col items-center justify-center text-center">
                <i class="fa-solid fa-flag-checkered text-6xl text-indigo-500 mb-4"></i>
                <h2 class="text-2xl font-bold mb-2">Game Over!</h2>
                <p class="text-gray-600 mb-6">You scored <span id="final-score"
                        class="font-bold text-indigo-600">0</span></p>
                <div class="flex gap-4">
                    <button onclick="restartGame()" class="btn-pink px-6 py-2 rounded-full font-bold">Play
                        Again</button>
                    <a href="../index.html" class="text-gray-500 hover:text-dark-purple py-2">Exit</a>
                </div>
            </div>
        </div>

        <div class="flex gap-8 mt-10">
            <button id="btn-fiction"
                class="h-16 w-16 bg-white rounded-full shadow-lg text-red-500 text-2xl hover:bg-red-50 hover:scale-110 transition-transform flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button id="btn-fact"
                class="h-16 w-16 bg-white rounded-full shadow-lg text-green-500 text-2xl hover:bg-green-50 hover:scale-110 transition-transform flex items-center justify-center">
                <i class="fa-solid fa-check"></i>
            </button>
        </div>

        <div id="feedback-popup"
            class="hidden absolute inset-0 bg-gray-900 bg-opacity-60 z-[60] flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl p-8 max-w-sm w-full text-center shadow-2xl">
                <div id="feedback-icon" class="text-6xl mb-4"></div>
                <h2 id="feedback-title" class="text-3xl font-extrabold mb-3"></h2>
                <p id="feedback-explanation" class="text-gray-700 mb-8 text-lg"></p>
                <button id="btn-next"
                    class="w-full bg-pink-500 text-white py-3 rounded-full font-bold text-xl shadow-md hover:bg-pink-600 transition-colors">Continue</button>
            </div>
        </div>
    </main>
    <script src="swipe.js"></script>
</body>

</html>
