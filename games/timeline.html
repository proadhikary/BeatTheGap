<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Tracers - BeatTheGap | Sort History</title>
    <meta name="description" content="Put historical events in the correct timeline order in this educational game. Learn about key milestones in STEM history. Part of the BeatTheGap arcade.">
    <meta name="keywords" content="timeline, history, STEM events, interactive learning, chronology">
    <meta name="author" content="STEMtheGap">
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Timeline Tracers - BeatTheGap">
    <meta property="og:description" content="Put STEM events in the correct timeline order">
    <meta property="og:image" content="../og-image.webp">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Timeline Tracers - BeatTheGap">
    <meta name="twitter:description" content="Interactive historical timeline sorting game">
    <meta name="twitter:image" content="../og-image.webp">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../og-image.webp">
    <link rel="alternate icon" type="image/webp" href="../og-image.webp">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .sortable-ghost {
            opacity: 0.4;
            background-color: #fce7f3;
            /* pink-100 */
        }

        .sortable-drag {
            cursor: grabbing;
        }
    </style>
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center bg-orange-50">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div class="rounded-full p-1 bg-yellow-400">
                    <img src="../og-image.webp" alt="BeatTheGap Logo" class="h-10 w-10 rounded-full object-cover">
                </div>
                <span class="text-xl font-bold text-pink-custom">BeatTheGap</span>
            </a>
        </div>
        <nav>
            <a href="../index.html"
                class="text-pink-custom font-bold hover:text-purple-900 transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-6 flex flex-col items-center justify-center bg-orange-50">
        <div class="max-w-2xl w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-dark-purple mb-2">Order History</h1>
                <p class="text-gray-600">Drag and drop these events into the correct chronological order (Earliest Top
                    to Latest Bottom).</p>
            </div>

            <div id="timeline-list" class="space-y-4">
                <!-- Items injected here -->
            </div>

            <div class="mt-8 flex justify-center">
                <button onclick="checkOrder()"
                    class="btn-pink px-10 py-3 rounded-full font-bold shadow-lg hover:shadow-xl text-lg w-full md:w-auto">
                    Check Order
                </button>
            </div>

            <div id="result-modal"
                class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-xl p-8 max-w-md w-full text-center relative">
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-xmark text-2xl"></i>
                    </button>
                    <div id="modal-icon"
                        class="h-20 w-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                        <!-- Icon -->
                    </div>
                    <h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>
                    <p id="modal-msg" class="text-gray-600 mb-6"></p>
                    <button id="next-level-btn" onclick="nextLevel()"
                        class="hidden btn-pink px-8 py-2 rounded-full font-bold">Next Level</button>
                    <button id="retry-btn" onclick="closeModal()"
                        class="hidden bg-gray-200 text-gray-700 hover:bg-gray-300 px-8 py-2 rounded-full font-bold">Try
                        Again</button>
                </div>
            </div>
        </div>
    </main>

    <script src="timeline.js"></script>
</body>

</html>
