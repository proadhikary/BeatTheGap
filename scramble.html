<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientist Scramble - BeatTheGap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="sticky top-0 z-50 p-4 px-10 flex justify-between items-center bg-teal-50">
        <div class="flex items-center gap-4">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="h-10 w-10 bg-teal-500 rounded-full flex items-center justify-center text-white font-bold text-lg">
                    SS
                </div>
                <span class="text-xl font-bold text-teal-700">Scramble</span>
            </a>
        </div>
        <nav>
            <a href="index.html"
                class="text-teal-700 font-bold hover:text-dark-purple transition-colors uppercase text-sm tracking-wider">
                <i class="fa fa-arrow-left mr-2"></i> Back to Home
            </a>
        </nav>
    </header>

    <main class="min-h-screen p-6 flex flex-col items-center justify-center bg-teal-50">
        <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="mb-6">
                <h1 class="text-3xl font-bold text-dark-purple mb-2">Who is she?</h1>
                <p class="text-gray-500 text-sm font-bold uppercase tracking-wider">Unscramble the Pioneer's Name</p>
            </div>

            <div id="game-content">
                <div class="bg-teal-100 p-4 rounded-lg mb-8">
                    <p class="text-sm font-bold text-teal-700 mb-1">HINT</p>
                    <p id="hint-text" class="text-lg text-teal-900 italic">"Known as the Rocket Woman of India"</p>
                </div>

                <div id="scrambled-word"
                    class="text-4xl md:text-5xl font-mono font-bold text-dark-purple tracking-widest mb-8 break-words">
                    R I T U K A R I D H A L
                </div>

                <div class="mb-6">
                    <input type="text" id="user-input"
                        class="w-full border-b-4 border-teal-300 text-center text-2xl py-2 focus:outline-none focus:border-pink-500 transition-colors uppercase font-bold text-gray-700"
                        placeholder="TYPE ANSWER HERE">
                </div>

                <div class="flex gap-4 justify-center">
                    <button onclick="checkAnswer()"
                        class="btn-pink px-8 py-3 rounded-full font-bold shadow-md hover:shadow-lg">
                        Check Answer
                    </button>
                    <button onclick="skipWord()" class="text-gray-400 hover:text-gray-600 font-bold px-4">
                        Skip
                    </button>
                </div>

                <p id="feedback" class="mt-4 font-bold h-6"></p>
            </div>

            <div id="end-screen" class="hidden">
                <i class="fa-solid fa-star text-6xl text-yellow-400 mb-4 animate-spin-slow"></i>
                <h2 class="text-3xl font-bold mb-4">Puzzle Complete!</h2>
                <p class="mb-6 text-gray-600">You've unlocked the names of history's hidden figures.</p>
                <button onclick="restartGame()" class="btn-pink px-8 py-3 rounded-full font-bold">Play Again</button>
            </div>
        </div>
    </main>

    <script src="scramble.js"></script>
</body>

</html>
